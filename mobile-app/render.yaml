# ─── Render Blueprint ──────────────────────────────────────────────
# This file defines the infrastructure for the LLC app on Render.
# Go to https://render.com/deploy and connect the repo.
# Render reads this file and creates everything automatically.
# ───────────────────────────────────────────────────────────────────

services:
  # ── Backend API ──
  - type: web
    name: llc-backend
    runtime: node
    region: eu-west        # Ireland — closest to TUS
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: JWT_SECRET
        sync: false  
      - key: DATABASE_URL
        fromDatabase:
          name: llc-database
          property: connectionString

  # ── Frontend (Expo web export) ──
  - type: web
    name: llc-frontend
    runtime: static
    region: eu-west
    rootDir: mobile-app
    buildCommand: npx expo export:web
    staticPublishPath: dist
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  # ── PostgreSQL ──
  - name: llc-database
    plan: free
    region: eu-west
